[project]
name = "elogistics-backend"
version = "0.1.0"
description = "Elogistics Facturación — backend FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "bcrypt>=4.2,<5.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "boto3>=1.35",
    "openpyxl>=3.1",
    "pypdf>=5",
    "pyyaml>=6",
    "resend>=2.4",
    "tzdata>=2024.1",  # zona horaria de México aunque la imagen no traiga /usr/share/zoneinfo
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# El boilerplate de Alembic (script.py.mako y cada migración generada) sigue el
# estilo propio de Alembic (Union/Sequence de typing); no lo forzamos a nuestro estilo.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query()/require_role() en defaults es el idiom estándar de FastAPI, no un bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "app.core.deps.require_role"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
